<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chat</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { height: 100%; overflow: hidden; background: transparent; }
	body { display: flex; flex-direction: column; justify-content: flex-end; font: 14px/18px Segoe UI, sans-serif; color: #fff; text-shadow: 1px 1px 0 #000; }
	#log { overflow: hidden; padding: 4px 6px; word-wrap: break-word; }
	#in { display: none; margin-top: 4px; padding: 5px 6px; border: 0; outline: 0; font: inherit; color: #fff; background: rgba(0, 0, 0, 0.6); }
	.open #log { overflow-y: auto; background: rgba(0, 0, 0, 0.35); }
	.open #in { display: block; }
</style>
</head>
<body>
<div id="log"></div>
<input id="in" maxlength="200">
<script>
	const log = document.getElementById('log'), input = document.getElementById('in'), bridge = window.JC4MP

	// what was sent (messages and commands), newest last. Up/Down browse it, past the newest the draft comes back
	const HISTORY_MAX = 50, history = []
	let browse = 0, draft = ''

	bridge.on('msg', text => {
		log.append(Object.assign(document.createElement('div'), { textContent: text }))
		while (log.children.length > 100) log.firstChild.remove()
		log.scrollTop = log.scrollHeight
	})

	bridge.on('open', open => {
		document.body.classList.toggle('open', open)
		input.value = ''
		browse = history.length
		input.focus()
	})

	input.onblur = () => document.body.classList.contains('open') && setTimeout(() => input.focus())

	input.onkeydown = e => {
		if (e.key === 'Enter') {
			const text = input.value

			if (text.trim() && history[history.length - 1] !== text) {
				history.push(text)
				if (history.length > HISTORY_MAX) history.shift()
			}

			bridge.sendMessage('send', text)
		}
		else if (e.key === 'Escape') bridge.sendMessage('close', '')
		else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
			e.preventDefault()

			const next = browse + (e.key === 'ArrowUp' ? -1 : 1)

			if (next < 0 || next > history.length) return
			if (browse === history.length) draft = input.value

			browse = next
			input.value = browse === history.length ? draft : history[browse]
		}
	}
</script>
</body>
</html>
