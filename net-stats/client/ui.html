<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Net Stats</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { height: 100%; overflow: hidden; background: transparent; }
	body { display: flex; align-items: center; padding-left: 10px; font: 12px/16px Consolas, monospace; color: #fff; text-shadow: 1px 1px 0 #000; }
	#lines { padding: 6px; background: rgba(0, 0, 0, 0.55); white-space: pre; }
	.header { color: #66ccff; }
	.good { color: #66ff66; }
	.warn { color: #ffd94d; }
	.bad { color: #ff5959; }
</style>
</head>
<body>
<div id="lines"></div>
<script>
	window.JC4MP.on('lines', lines => document.getElementById('lines').replaceChildren(...(Array.isArray(lines) ? lines : []).map(line =>
		Object.assign(document.createElement('div'), { className: line.color, textContent: line.text }))))
</script>
</body>
</html>
